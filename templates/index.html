<!doctype html><html><head><meta charset="utf-8"><title>Threat Intelligence Platform</title><link rel="stylesheet" href="/static/style.css"></head><body><main><h1>Threat Intelligence Platform</h1><form id="f"><input name="type" placeholder="ip/domain/url/hash/email"><input name="value" placeholder="IOC value" required><input name="source" placeholder="source"><button>Add IOC</button></form><table><thead><tr><th>Type</th><th>Value</th><th>Source</th><th>Confidence</th></tr></thead><tbody id="rows"></tbody></table></main><script>async function load(){let r=await fetch('/api/iocs');let d=await r.json();rows.innerHTML=d.map(x=>'<tr><td>'+x.type+'</td><td>'+x.value+'</td><td>'+x.source+'</td><td>'+x.confidence+'</td></tr>').join('')}f.onsubmit=async e=>{e.preventDefault();let o=Object.fromEntries(new FormData(f));await fetch('/api/iocs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)});f.reset();load()};load()</script></body></html>
